[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posedetect"
version = "2.0.0"
description = "Real-time human pose detection and yoga/fitness pose classification with MediaPipe and OpenCV"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Samarth Jaiswal" }]
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
posedetect = "posedetect.__main__:main"

[tool.setuptools]
packages = ["posedetect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: runs the real MediaPipe model (downloads it on first use)"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "I"]
