name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a breaking MediaPipe release is caught even without new commits.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/posedetect
          key: pose-models-v1
      - name: Install MediaPipe system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2 libgl1
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v
